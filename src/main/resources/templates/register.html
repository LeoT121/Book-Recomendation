<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Crear Cuenta</h1>
                <p>Únete a nuestra comunidad de amantes de los libros</p>
            </div>
            
            <form action="/register" method="post" class="auth-form">
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required placeholder="Tu nombre completo">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Crea una contraseña segura">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-text">Registrarse</span>
                    <span class="btn-icon">→</span>
                </button>
                
                <div class="auth-footer">
                    <a href="/login" class="auth-link">¿Ya tienes cuenta? <span>Inicia Sesión</span></a>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/theme.js"></script>
</body>
</html>
