<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.ID == null} ? 'Nuevo Usuario' : 'Editar Usuario'">Editar Usuario</title>
    <link rel="stylesheet" href="/css/administrador.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <div class="header">
        <h1>Sistema de Recomendaciones</h1>
        <p>Panel de Administración</p>
    </div>
    
    <div class="container">
        <div class="admin-header">
            <h2 th:text="${usuario.ID == null} ? 'Nuevo Usuario' : 'Editar Usuario'">Editar Usuario</h2>
        </div>
        
        <!-- Mensaje de resultado -->
        <div th:if="${mensaje}" class="mensaje" th:classappend="${tipoMensaje == 'error'} ? 'mensaje-error' : 'mensaje-exito'">
            <p th:text="${mensaje}"></p>
        </div>
        
        <form th:action="@{/admin/usuarios/update/{id}(id=${usuario.ID != null ? usuario.ID : -1L})}" method="post" class="edit-form">
            <!-- Campo oculto para el ID -->
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" th:value="${usuario.name}" required />
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${usuario.email}" required />
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password"  th:placeholder="${usuario.ID == null} ? 'La contraseña es obligatoria' : 'Dejar en blanco para mantener la actual'"
                     th:required="${usuario.ID == null}" />
            </div>
            
            <div class="form-group">
                <label>Roles:</label>
                <div class="roles-container">
                    <div class="role-option" th:each="rol : ${todosLosRoles}">
                        <input type="checkbox" name="roles" th:id="${'rol-' + rol.id}" th:value="${rol.id}" 
                               th:checked="${usuario.roles != null && usuario.roles.contains(rol)}" />
                        <label th:for="${'rol-' + rol.id}" th:text="${rol.name == 'ROLE_ADMIN' ? 'Administrador' : 'Usuario'}"></label>
                    </div>
                </div>
            </div>
            
            <div class="form-buttons">
                <a href="/admin/usuarios" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </div>
    <script src="/js/theme.js"></script>
</body>
</html>
