<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Iniciar Sesión</h1>
                <p>Bienvenido de vuelta a nuestro sistema de recomendación de libros</p>
            </div>
            
            <form action="/login" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required placeholder="Ingresa tu nombre de usuario">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-icon">→</span>
                </button>
                
                <div class="auth-footer">
                    <a href="/register" class="auth-link">¿No tienes cuenta? <span>Regístrate</span></a>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/theme.js"></script>
</body>
</html>
